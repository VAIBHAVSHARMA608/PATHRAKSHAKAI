<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=1,H=1;
function rs(){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();new ResizeObserver(rs).observe(cv);
const RW=4,DT=1/30,K=40,DP=0.1,EHL=2.1,EHW=0.9,CR=12,BACK=9,CAMH=2.1;
const WHEELBASE=2.75,MAX_STEER=0.48,MAX_STEER_RATE=0.75,MAX_LATERAL_ACCEL=5.5,MAX_JERK=5;
const S={t:0,x:0,y:0,yaw:0,steer:0,vy:0,v:10,ax:0,ay:0,mode:true,pause:false,hits:0,flash:0,jolt:0,obs:[],sp:1,cam:0,cmd:{yt:0,w:1.4,vt:CR},plan:null,tm:0,tmode:'auto',prev:0,brake:0,nid:0,objCount:3,objSpeed:1,objSize:1,maxObstacles:6,rerouteBias:1};
const h=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const lerp=(a,b,t)=>a+(b-a)*t,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(c1,c2,t)=>`rgb(${c1.map((v,i)=>Math.round(lerp(v,c2[i],t))).join(',')})`;
const hz=()=>H*.38+(S.pit||0);
function P(X,Y,Z=0){const dz=X-(S.x-BACK);if(dz<.8)return null;const k=W*.95/dz;return{x:W/2+(Y-S.cam)*k,y:hz()+(CAMH-Z)*k,k}}
function step(x,y,yaw,v,ax,steer,yt,w,vt,dt){
 const lookAhead=cl(4.5+v*.65,5,14);
 const desiredHeading=Math.atan2(yt-y,lookAhead);
 const alpha=Math.atan2(Math.sin(desiredHeading-yaw),Math.cos(desiredHeading-yaw));
 const curvature=2*Math.sin(alpha)/lookAhead;
 const gripSteer=Math.atan(WHEELBASE*MAX_LATERAL_ACCEL/Math.max(v*v,1));
 const steerLimit=Math.min(MAX_STEER,gripSteer);
 const desiredSteer=cl(Math.atan(WHEELBASE*curvature)*(w/1.25),-steerLimit,steerLimit);
 steer+=cl(desiredSteer-steer,-MAX_STEER_RATE*dt,MAX_STEER_RATE*dt);
 const desiredAx=cl(1.8*(vt-v),-6,2);
 ax+=cl(desiredAx-ax,-MAX_JERK*dt,MAX_JERK*dt);
 v=Math.max(v+ax*dt,0);
 const yawRate=v/WHEELBASE*Math.tan(steer);
 const ay=v*yawRate;
 yaw+=yawRate*dt;
 x+=v*Math.cos(yaw)*dt;
 y+=v*Math.sin(yaw)*dt;
 const vy=v*Math.sin(yaw);
 return[x,y,yaw,v,ax,steer,vy,ay]
}
/* ---------- obstacles ---------- */
const COL={cow:'#8d5a2b',ped:'#e8c33a',bike:'#e8812a',truck:'#4f7fb0',rick:'#e5c21a',pot:'#2b2b2b'};
function spawn(type,X,Y){const o={id:S.nid++,type,X:X??S.x+95+Math.random()*25,Y:Y??0,vx:0,vy:0,r:.6,st:0,t0:0,hit:0,ph:Math.random()*6.28,tr:20+Math.random()*14,dir:1,ts:2+Math.random()*2,sh:Math.floor(Math.random()*4)};
 const speed = S.objSpeed || 1;
 const size = S.objSize || 1;
 const d=Math.random()<.5?-1:1;
 if(type=='cow'){o.r=.85*size;o.dir=-d;o.Y=d*(RW+1.3);o.stopY=(Math.random()-.5)*1.2;o.vx=-(3+Math.random()*2.5)*speed}
 else if(type=='ped'){o.r=.45*size;o.dir=-d;o.Y=d*(RW+.6);o.tr=14+Math.random()*10;o.vx=-(1.4+Math.random()*1.5)*speed}
 else if(type=='bike'){o.r=.6*size;o.vx=-(6+Math.random()*3)*speed;o.Y=Y??(Math.random()*4-1.5)}
 else if(type=='truck'){o.r=1.3*size;o.vx=-(4.2+Math.random()*2.4)*speed;o.Y=Y??d*(RW-1.2)}
 else if(type=='rick'){o.r=1.0*size;o.vx=-(3.5+Math.random()*2.0)*speed;o.Y=Y??(Math.random()*4-2)}
 else if(type=='pot'){o.r=.75*size;o.Y=Y??(Math.random()*4.4-2.2);o.vx=0}
 S.obs.push(o)}
function spawnChoice(type,count=1){
 const selectedType = type || 'cow';
 const total = Math.max(1, Math.round(count || S.objCount || 1));
 for(let i=0;i<total;i++){
  const spacing = 12 + i * 3;
  const x = S.x + 40 + spacing + Math.random() * 8;
  const side = Math.random() < 0.5 ? -1 : 1;
  if(selectedType === 'pot') spawn(selectedType, x, (Math.random() * 4.2 - 2.1));
  else spawn(selectedType, x, side * (RW * 0.55 + Math.random() * 1.8));
 }
}
function behave(o,dt){const gap=o.X-S.x;
 if(o.type=='ped'){if(o.st==0&&gap<o.tr)o.st=1;if(o.st==1){o.vy=1.3*o.dir;if(Math.abs(o.Y)>RW+.7&&Math.sign(o.Y)==o.dir)o.st=2}if(o.st==2)o.vy=0}
 if(o.type=='cow'){if(o.st==0&&gap<o.tr+8){o.st=1}if(o.st==1){o.vy=1.8*o.dir;if(o.dir*(o.Y-o.stopY)>=0){o.st=2;o.vy=0;o.t0=S.t}}
  else if(o.st==2&&S.t-o.t0>o.ts){o.st=3;o.vy=1.0*o.dir}else if(o.st==3&&Math.abs(o.Y)>RW+2.5){o.vy=0}}
 if(o.type=='bike')o.vy=Math.sin(S.t*1.6+o.ph)*1.0;
 o.X+=o.vx*dt;o.Y+=o.vy*dt}
/* ---------- planner ---------- */
function planner(){const obs=S.obs.filter(o=>o.X-S.x>-4&&o.X-S.x<75&&sees(o));
 if(!S.mode){let vt=S.cr;for(const o of obs){const gp=o.X-S.x-(EHL+o.r);if(o.X>S.x&&Math.abs(o.Y)<EHW+o.r+.4&&o.type!='pot')vt=Math.min(vt,Math.sqrt(2*5*Math.max(gp-3.5,0)))}
  S.plan=null;return{yt:0,w:1.4,vt}}
 const ys=[];for(let i=0;i<9;i++)ys.push(-2.6+i*.65);const vs=[0,3,6,9,S.cr],ws=[.9,1.6],C=[];
 for(const yt of ys)for(const w of ws)for(const vt of vs){let x=S.x,y=S.y,yaw=S.yaw||0,v=S.v,ax=S.ax,steer=S.steer||0,vy=S.vy,ay=S.ay;const T=[];
  for(let k=0;k<K;k++){[x,y,yaw,v,ax,steer,vy,ay]=step(x,y,yaw,v,ax,steer,yt,w,vt,DP);T.push([x,y])}
  let risk=0,col=0;
  for(const o of obs){const sp=Math.hypot(o.vx,o.vy);for(let k=0;k<K;k++){const t=(k+1)*DP,px=o.X+o.vx*t,py=o.Y+o.vy*t,sg=.25+t*(.1+.3*sp),a=EHL+o.r,b=EHW+o.r;
    const dn=Math.hypot((T[k][0]-px)/a,(T[k][1]-py)/b),sl=Math.min(.25+t*(.1+.4*Math.abs(o.vy)+.04*Math.abs(o.vx)),1.2);
    if(dn<1.05+.8*sl/b)col++;const sn=.12+sg/b;const e=Math.max(dn-1,0)/sn;risk+=Math.exp(-.5*e*e)*DP}}
  let edge=0;for(const p of T)edge+=Math.max(Math.abs(p[1])-(RW-1),0)*DP;
  const rerouteBoost = S.rerouteBias || 1;
  const cost=S.rw*risk+1e3*col+6*edge-.3*(T[K-1][0]-S.x)+rerouteBoost*(.15*yt*yt+.8*Math.abs(yt-S.prev))+.15*Math.abs(vt-S.v);
  C.push({yt,w,vt,T,cost,col,risk})}
 C.sort((a,b)=>a.cost-b.cost);const b=C[0];S.prev=b.yt;
 S.plan={best:b,alts:C.filter(c=>c.col==0).slice(1,60).filter((_,i)=>i%6==0)};return{yt:b.yt,w:b.w,vt:b.vt}}
/* ---------- update ---------- */
function update(dt){S.t+=dt;
 S.fog+=((S.wx=='clear'?0:S.wx=='haze'?.45:.9)-S.fog)*Math.min(1,dt*.8);S.cr=S.crb*(1-.4*S.fog);
 S.pit=cl(S.ax*1.6,-9,9)+Math.sin(S.t*21)*S.v*.035+Math.sin(S.t*7.3)*S.v*.02;
 if(S.v>1.5)for(let i=0;i<2;i++){const sd=i?.75:-.75;S.pt.push({X:S.x-1.6,Y:S.y+sd,Z:.12,vx:-S.v*.25*Math.random(),vy:(Math.random()-.5)*1.4+sd*.8,vz:.5+Math.random()*.9,a:0,l:1.1+Math.random()*.9,s:.25+Math.random()*.25})}
 for(const q of S.pt){q.a+=dt;q.X+=q.vx*dt;q.Y+=q.vy*dt;q.Z+=q.vz*dt;q.vz*=.96;q.s+=dt*.9}S.pt=S.pt.filter(q=>q.a<q.l);
 if(S.tmode=='auto')S.tm=(S.tm+dt/120)%1;
 if(S.nf++%3==0){const t0=performance.now();S.cmd=planner();S.pms+=(performance.now()-t0-S.pms)*.1}
 [S.x,S.y,S.yaw,S.v,S.ax,S.steer,S.vy,S.ay]=step(S.x,S.y,S.yaw,S.v,S.ax,S.steer,S.cmd.yt,S.cmd.w,S.cmd.vt,dt);S.brake=cl(-S.ax/3,0,1);
 S.cam+=(S.y*.55-S.cam)*Math.min(1,dt*3);
 for(const o of S.obs){behave(o,dt);
  const dn=Math.hypot((S.x-o.X)/(EHL+o.r*(o.type=='pot'?.8:1)),(S.y-o.Y)/(EHW+o.r*(o.type=='pot'?.8:1)));
  if(dn<1&&!o.hit){o.hit=1;S.hits++;S.flash=1;S.jolt=1;if(o.type!='pot'){S.v*=.3;o.gone=1}}}
 S.obs=S.obs.filter(o=>!o.gone&&o.X>S.x-15&&o.X<S.x+220);
 S.sp-=dt;if(S.sp<=0&&S.auto&&S.obs.length<S.maxObstacles){const r=Math.random();spawn(r<.2?'cow':r<.4?'ped':r<.58?'bike':r<.72?'truck':r<.86?'rick':'pot');S.sp=(1.8+Math.random()*2.5)/S.rate}
 S.flash=Math.max(0,S.flash-dt*2);S.jolt=Math.max(0,S.jolt-dt*3)}
S.nf=0;S.pt=[];S.fog=0;S.wx='clear';S.cr=CR;S.pit=0;
/* ---------- drawing ---------- */
function poly(pts,fill){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fillStyle=fill;g.fill()}
function daylight(){return .5+.5*Math.cos(S.tm*6.2832)}
function sky(d){const hy=hz(),dusk=Math.max(0,1-Math.abs(d-.3)*5);
 const gr=g.createLinearGradient(0,0,0,hy);gr.addColorStop(0,mix([8,12,34],[60,128,190],d));gr.addColorStop(1,mix([26,30,60],[190,222,236],d));
 g.fillStyle=gr;g.fillRect(0,0,W,hy+2);
 if(dusk>0){const o=g.createLinearGradient(0,hy*.4,0,hy);o.addColorStop(0,'rgba(255,140,60,0)');o.addColorStop(1,`rgba(255,140,60,${.5*dusk})`);g.fillStyle=o;g.fillRect(0,0,W,hy+2)}
 if(d<.5){g.fillStyle=`rgba(255,255,255,${(.5-d)*1.6})`;for(let i=0;i<60;i++)g.fillRect(h(i)*W,h(i+90)*hy*.9,1.5,1.5)}
 const a=S.tm*6.2832,sx=W/2+Math.sin(a)*W*.42,sy=hy-Math.cos(a)*hy*.8,mx=W/2-Math.sin(a)*W*.42,my=hy+Math.cos(a)*hy*.8;
 {const gl=g.createRadialGradient(sx,sy,0,sx,sy,W*.28);gl.addColorStop(0,`rgba(255,220,150,${.55*cl(d*1.6,0,1)*(1-S.fog*.6)})`);gl.addColorStop(1,'rgba(255,220,150,0)');g.fillStyle=gl;g.fillRect(0,0,W,hy+2)}
 g.fillStyle='#ffe9a8';g.beginPath();g.arc(sx,sy,Math.max(14,W*.022),0,7);g.fill();
 g.fillStyle='#e8eefc';g.beginPath();g.arc(mx,my,Math.max(10,W*.014),0,7);g.fill();
 g.fillStyle=`rgba(255,255,255,${.15+.65*d})`;
 for(let i=0;i<7;i++){const cx=((h(i)*W*1.6-S.t*6-S.x*.4)%(W*1.4)+W*1.4)%(W*1.4)-W*.2,cy=hy*(.15+h(i+5)*.5),s=18+h(i+9)*26;
  [[0,0,1],[.9,.2,.8],[-.9,.25,.75],[.35,-.35,.7]].forEach(q=>{g.beginPath();g.arc(cx+q[0]*s,cy+q[1]*s,s*q[2],0,7);g.fill()})}
 for(const L of [[.1,.012,.6],[.045,.02,.9]]){g.fillStyle=mix([14,22,32],[L[2]>.7?[92,128,110]:[130,160,150]][0],d);g.beginPath();g.moveTo(0,hy);
  for(let x=0;x<=W;x+=12){g.lineTo(x,hy-(Math.sin(x*L[1]+S.x*L[0]*.1)*.5+.5)*hy*(L[2]*.16)-hy*.02)}g.lineTo(W,hy);g.fill()}}
function ground(d){const hy=hz();g.fillStyle=mix([22,26,22],[150,138,84],d);g.fillRect(0,hy,W,H-hy);

let datasetTimer=null;
async function pullDataset(){
 try{
  const response=await fetch('/api/realtime',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const event=await response.json();
  const status=$('datasetStatus');
  if(event.done){status.textContent='Dataset: replay complete';clearInterval(datasetTimer);return}
  const s=event.sensor||{};
  status.textContent=`Dataset: frame ${event.sequence+1}/20 | health ${(s.health_score*100).toFixed(0)}% | temp ${s.engine_temp}°C`;
  T('eR',`${s.vehicle_type} | ${s.tire_condition} tires`);
  T('eV',`Health ${(s.health_score*100).toFixed(0)}%`);
  T('eC',`Frame ${event.sequence+1}/20`);
 }catch(error){$('datasetStatus').textContent='Dataset: unavailable'}
}
async function pullPerception(){
 try{
  const response=await fetch('/api/perception',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const payload=await response.json();
  if(payload.done)return;
  if(payload.error){$('datasetStatus').textContent='Perception: unavailable';return}
  S.auto=0;S.datasetMode=1;
  S.obs=(payload.obstacles||[]).map(o=>({
   id:o.id,type:o.type,X:o.X+S.x,Y:o.Y,vx:0,vy:0,r:o.r,dir:1,st:0,t0:0,hit:0,ph:0,tr:20,ts:0,sh:o.id%4
  }));
  $('datasetStatus').textContent=`Dataset: camera frame | ${S.obs.length} detected object(s)`;
 }catch(error){$('datasetStatus').textContent='Perception: unavailable'}
}
